[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

# The reduced FIPS artifact must use aws-lc-fips-sys for cryptographic
# operations. These packages provide alternate or non-validated
# implementations, so the audit fails even when the corresponding code path is
# disabled at runtime.
[[bans.deny]]
name = "ring"
reason = "ring is not the validated cryptographic module selected for the FIPS artifact"

[[bans.deny]]
name = "aws-lc-sys"
reason = "the non-FIPS AWS-LC bindings must not be linked into the FIPS artifact"

[[bans.deny]]
name = "openssl"
reason = "OpenSSL is not an approved provider for this FIPS artifact"

[[bans.deny]]
name = "openssl-sys"
reason = "OpenSSL is not an approved provider for this FIPS artifact"

[[bans.deny]]
name = "boring"
reason = "BoringSSL is not an approved provider for this FIPS artifact"

[[bans.deny]]
name = "boring-sys"
reason = "BoringSSL is not an approved provider for this FIPS artifact"

[[bans.deny]]
name = "mbedtls"
reason = "Mbed TLS is not an approved provider for this FIPS artifact"

[[bans.deny]]
name = "mbedtls-sys"
reason = "Mbed TLS is not an approved provider for this FIPS artifact"

[[bans.deny]]
name = "mbedtls-sys-auto"
reason = "Mbed TLS is not an approved provider for this FIPS artifact"

[[bans.deny]]
name = "wolfssl"
reason = "wolfSSL is not an approved provider for this FIPS artifact"

[[bans.deny]]
name = "wolfssl-sys"
reason = "wolfSSL is not an approved provider for this FIPS artifact"

[[bans.deny]]
name = "sodiumoxide"
reason = "libsodium is not an approved provider for this FIPS artifact"

[[bans.deny]]
name = "libsodium-sys"
reason = "libsodium is not an approved provider for this FIPS artifact"

[[bans.deny]]
name = "nettle"
reason = "Nettle is not an approved provider for this FIPS artifact"

[[bans.deny]]
name = "nettle-sys"
reason = "Nettle is not an approved provider for this FIPS artifact"

[[bans.deny]]
name = "botan"
reason = "Botan is not an approved provider for this FIPS artifact"

[[bans.deny]]
name = "botan-sys"
reason = "Botan is not an approved provider for this FIPS artifact"

