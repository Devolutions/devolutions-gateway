<div class="session-ard-container">
  @if (loading) {
    <div class="loading-info-container">
      <div class="loading-info">
        @if (!hideSpinnerOnly) {
          <p-progressSpinner></p-progressSpinner>
        }
      </div>
    </div>
  }

  <iron-remote-desktop #ironRemoteDesktopElement targetplatform="web" verbose="true" scale="fit" flexcenter="true" [module]="backendRef"></iron-remote-desktop>

  @if (!loading && !currentStatus.isDisabled) {
    <div class="toolbar-overlay-anchor">
      <ard-toolbar-wrapper
        [actions]="clipboardActionButtons"
        [sessionActions]="ardSessionActions"
        [modeToggle]="ardModeToggle"
        [statusBadges]="ardStatusBadges"
        [sessionInfo]="sessionInfo"
        [initialState]="{ cursorCrosshair: cursorOverrideActive, wheelSpeed: wheelSpeed }"
        [wheelSpeedControl]="wheelSpeedControl"
        (sessionClose)="startTerminationProcess()"
        (screenModeChange)="handleScreenModeChange($event)"
        (cursorCrosshairChange)="onCursorCrosshairChange($event)"
        (wheelSpeedChange)="onWheelSpeedChange($event)"
        (controlModeChange)="onArdModeChange($event)">
      </ard-toolbar-wrapper>
    </div>
  }

  <!-- Appended to the element that goes fullscreen: the browser draws nothing outside it while fullscreen. -->
  <p-dialog header="Show curtain" [modal]="true" [(visible)]="curtainDialogVisible" [style]="{ width: '420px' }" [breakpoints]="{ '480px': '90vw' }" [appendTo]="sessionsContainerElement.nativeElement">
    <form class="ard-curtain-form" (ngSubmit)="submitCurtain()">
      <label for="ardCurtainMessage">Message shown on the Mac</label>
      <input pInputText
             id="ardCurtainMessage"
             name="curtainMessage"
             type="text"
             autocomplete="off"
             [ngModel]="curtainMessage"
             (ngModelChange)="onCurtainMessageChange($event)"
             [attr.aria-invalid]="curtainMessageTooLong"/>
      @if (curtainMessageTooLong) {
        <span class="form-helper-text" role="alert">The message must be at most {{ maxCurtainMessageBytes }} bytes.</span>
      }
      <div class="ard-curtain-form-actions">
        <p-button type="button" label="Cancel" severity="secondary" (onClick)="curtainDialogVisible = false"></p-button>
        <p-button type="submit" label="Show" [disabled]="curtainMessageTooLong || !!ardPending"></p-button>
      </div>
    </form>
  </p-dialog>
</div>
