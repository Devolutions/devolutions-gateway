<p-dialog #dialog [modal]="true" [visible]="visible" (visibleChange)="!$event && cancel()" [style]="{ width: '520px' }" [breakpoints]="{ '560px': '90vw' }" [appendTo]="appendTo" styleClass="credentials-prompt-dialog">
  <ng-template #header>
    <div class="credentials-prompt-title">
      <i class="dvl-icon dvl-icon-screen" aria-hidden="true"></i>
      <!-- The dialog's aria-labelledby points at this id; a custom header drops PrimeNG's own title element. -->
      <span [id]="dialog.ariaLabelledBy">Enter credentials</span>
    </div>
  </ng-template>

  <form class="credentials-prompt-form">
    <label for="credentialsPromptHost">Host</label>
    <div class="credentials-prompt-field">
      <i class="dvl-icon dvl-icon-host" aria-hidden="true"></i>
      <input pInputText
             id="credentialsPromptHost"
             name="host"
             type="text"
             tabindex="-1"
             readonly
             [value]="host"/>
    </div>

    @if (askUsername) {
      <label for="credentialsPromptUsername">Username</label>
      <div class="credentials-prompt-field">
        <i class="dvl-icon dvl-icon-user" aria-hidden="true"></i>
        <input pInputText
               id="credentialsPromptUsername"
               name="username"
               type="text"
               autocomplete="username"
               [(ngModel)]="username"
               (keydown.enter)="submit()"/>
      </div>
    }

    @if (askPassword) {
      <label for="credentialsPromptPassword">Password</label>
      <div class="credentials-prompt-field">
        <i class="dvl-icon dvl-icon-password-key" aria-hidden="true"></i>
        <input pInputText
               id="credentialsPromptPassword"
               name="password"
               [type]="showPassword ? 'text' : 'password'"
               autocomplete="current-password"
               [(ngModel)]="password"
               (keydown.enter)="submit()"/>
        <button type="button"
                class="credentials-prompt-reveal"
                aria-label="Show password"
                [attr.aria-pressed]="showPassword"
                (click)="showPassword = !showPassword">
          <i class="dvl-icon dvl-icon-view" aria-hidden="true"></i>
        </button>
      </div>
    }
  </form>

  <ng-template #footer>
    <p-button label="Login" [disabled]="!canSubmit()" (onClick)="submit()"></p-button>
    <p-button label="Cancel" severity="secondary" (onClick)="cancel()"></p-button>
  </ng-template>
</p-dialog>
