[package]
name = "device-key"
version = "0.0.0"
authors = ["Devolutions Inc. <infos@devolutions.net>"]
edition = "2024"
description = "Device keys, kept in a key store backend"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
camino = "1"
p256 = { version = "=0.14.0-rc.14", features = ["ecdsa", "pkcs8"] }
private-fs = { path = "../private-fs" }
rand = "0.10"
secure-memory = { path = "../secure-memory" }
sha2 = "0.11"
signature = { version = "3", features = ["alloc"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
base64 = "0.23"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
win-api-wrappers = { path = "../win-api-wrappers" }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
