syntax = "proto3";
package devolutions.agent.channel.v1;

option csharp_namespace = "Devolutions.Agent.Channel.V1";

import "google/protobuf/timestamp.proto";

service AgentChannel {
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);
}

message AgentMessage {
  string id = 1;
  optional string correlation_id = 2;
  oneof payload {
    Hello hello = 10;
    Ack ack = 11;
    DeviceManagementReport device_management = 12;
  }
}

message ServerMessage {
  string id = 1;
  optional string correlation_id = 2;
  oneof payload {
    Welcome welcome = 10;
    Ack ack = 11;
    RenewRequested renew_requested = 12;
    Reconnect reconnect = 13;
    Challenge challenge = 14;
    ConfigUpdate config_update = 15;
    DeviceManagementRequest device_management = 16;
  }
}

// The device's effective config (§5.2 shape) as a UTF-8 JSON object.
message ConfigUpdate {
  string config_json = 1;
}

message Challenge {
  // 32 random bytes, fresh per stream.
  bytes challenge = 1;
}

message Hello {
  map<string, string> metadata = 1;
  repeated string capabilities = 2;
  map<string, uint64> applied_state_versions = 3;
  // Proof of key possession bound to this stream (§7.3).
  bytes proof = 4;
}

message Welcome {
  google.protobuf.Timestamp server_time = 1;
}

message Ack {}

message RenewRequested {
  // "admin" or "rotation".
  string reason = 1;
}

message Reconnect {
  string reason = 1;
}

// Device management. The authority sends these requests only to an agent whose Hello lists the
// "device_management" capability. The agent answers on the same channel; each report carries the
// request message id as its correlation_id.
message DeviceManagementRequest {
  oneof request {
    SyncInventory sync_inventory = 1;
    PackageOperationRequest package_operation = 2;
    CatalogSync catalog_sync = 3;
    DiscoverUniGetUiInstances discover_unigetui_instances = 4;
  }
}

message DeviceManagementReport {
  oneof report {
    InventoryReport inventory = 1;
    PackageOperationResult package_operation_result = 2;
    CatalogSyncResult catalog_sync_result = 3;
    UniGetUiInstances unigetui_instances = 4;
    PackageOperationResult package_operation_unknown = 5;
    InventoryUnavailable inventory_unavailable = 6;
    UniGetUiInstancesUnavailable unigetui_instances_unavailable = 7;
  }
}

message SyncInventory {
  reserved 1;
  reserved "target_user_sid";
  string target_user_uuid = 2;
  string registry_epoch = 3;
}

message DiscoverUniGetUiInstances {}

// Sent only for a complete discovery scan; it replaces the previous instance set.
message UniGetUiInstances {
  repeated UniGetUiInstance instances = 1;
  string registry_epoch = 2;
}

message UniGetUiInstancesUnavailable {
  UniGetUiInstancesUnavailableReason reason = 1;
}

enum UniGetUiInstancesUnavailableReason {
  UNI_GET_UI_INSTANCES_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  UNI_GET_UI_INSTANCES_UNAVAILABLE_REASON_BUSY = 1;
  UNI_GET_UI_INSTANCES_UNAVAILABLE_REASON_COLLECTION_FAILED = 2;
  UNI_GET_UI_INSTANCES_UNAVAILABLE_REASON_TOO_LARGE = 3;
}

message UniGetUiInstance {
  reserved 1;
  reserved "user_sid";
  uint32 session_id = 2;
  string display_name = 3;
  bool signature_verified = 4;
  string user_uuid = 5;
}

// Inventory pages share a report ID and page count. Only the final index has last = true.
// The first page carries the managers and sources. A complete inventory replaces the previous one.
message InventoryReport {
  reserved 6;
  reserved "target_user_sid";
  string report_id = 1;
  bool last = 2;
  repeated InstalledPackage packages = 3;
  repeated PackageManager managers = 4;
  repeated PackageSource sources = 5;
  uint32 page_index = 7;
  uint32 page_count = 8;
  string target_user_uuid = 9;
  string registry_epoch = 10;
  // Completion time of the installed-package scan, not the report time.
  google.protobuf.Timestamp scan_completed_at = 11;
  // Completion time of the update scan; absent when no complete update scan is available.
  google.protobuf.Timestamp update_scan_completed_at = 12;
}

message InventoryUnavailable {
  reserved 1;
  reserved "target_user_sid";
  InventoryUnavailableReason reason = 2;
  string target_user_uuid = 3;
  string registry_epoch = 4;
}

enum InventoryUnavailableReason {
  INVENTORY_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  INVENTORY_UNAVAILABLE_REASON_SAFE_ENDPOINT_UNAVAILABLE = 1;
  INVENTORY_UNAVAILABLE_REASON_BUSY = 2;
  INVENTORY_UNAVAILABLE_REASON_COLLECTION_FAILED = 3;
}

message InstalledPackage {
  string manager = 1;
  string source = 2;
  string id = 3;
  string name = 4;
  string version = 5;
  // Advisory newer version. Empty when unavailable or when no update is reported.
  string available_version = 6;
  // Proven ownership: USER, MACHINE or UNKNOWN.
  string scope = 7;
  // Canonical broker source name. Empty when unavailable.
  string source_name = 8;
  // Manager-reported scope, which does not establish ownership.
  string reported_scope = 9;
}

message PackageManager {
  string name = 1;
  bool installed = 2;
  bool enabled = 3;
  string version = 4;
}

message PackageSource {
  string manager = 1;
  string name = 2;
  string url = 3;
}

enum PackageOperationType {
  PACKAGE_OPERATION_TYPE_INSTALL = 0;
  PACKAGE_OPERATION_TYPE_UPDATE = 1;
  PACKAGE_OPERATION_TYPE_UNINSTALL = 2;
}

enum PackageOperationStatus {
  PACKAGE_OPERATION_STATUS_UNSPECIFIED = 0;
  PACKAGE_OPERATION_STATUS_UNKNOWN = 1;
}

// Requests one package operation for a live UniGetUI instance owned by target_user_uuid.
message PackageOperationRequest {
  reserved 7;
  reserved "target_user_sid";
  string operation_id = 1;
  PackageOperationType type = 2;
  string manager = 3;
  string source = 4;
  string package_id = 5;
  string version = 6;
  string scope = 8;
  string target_user_uuid = 9;
  string registry_epoch = 10;
}

// Answer to PackageOperationRequest.
// UNKNOWN means the outcome cannot be recovered.
message PackageOperationResult {
  string operation_id = 1;
  bool success = 2;
  string error = 3;
  PackageOperationStatus status = 4;
  // True is trusted evidence of start; false or absent does not prove that no work started.
  optional bool execution_started = 5;
}

message CatalogSync {
  int64 revision = 1;
  oneof content {
    string document = 2;
    bool delete = 3;
  }
}

message CatalogSyncResult {
  int64 revision = 1;
  bool ok = 2;
  string error = 3;
}
