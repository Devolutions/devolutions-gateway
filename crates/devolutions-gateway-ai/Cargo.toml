[package]
name = "devolutions-gateway-ai"
version = "0.0.0"
edition = "2024"
authors = ["Devolutions Inc. <infos@devolutions.net>"]
description = "AI requests for Devolutions Gateway, one method per purpose"
publish = false

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
url = "2.5"
