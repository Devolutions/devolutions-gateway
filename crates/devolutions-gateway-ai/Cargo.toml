[package]
name = "devolutions-gateway-ai"
version = "0.0.0"
edition = "2024"
authors = ["Devolutions Inc. <infos@devolutions.net>"]
description = "High-level AI for Devolutions Gateway, one method per purpose"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
camino = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
tokio = { version = "1.52", features = ["fs", "macros", "rt"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2.5"

[dev-dependencies]
tempfile = "3.24"
tokio = { version = "1.52", features = ["io-util", "macros", "net", "rt-multi-thread"] }
