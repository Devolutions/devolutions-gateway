[package]
name = "devolutions-gateway"
version.workspace = true
edition = "2024"
readme = "README.md"
license = "MIT/Apache-2.0"
authors = ["Devolutions Inc. <infos@devolutions.net>"]
description = "Protocol-aware fine-grained relay server"
publish = false
default-run = "devolutions-gateway"

[lints]
workspace = true

[features]
default = ["standard"]
standard = [
    "agent-tunnel/standard",
    "agent-tunnel-libsql/standard",
    "dep:argon2",
    "dep:agent-tunnel-libsql",
    "dep:chacha20poly1305",
    "dep:ironrdp-acceptor",
    "dep:ironrdp-connector",
    "dep:ironrdp-tokio",
    "dep:kdc",
    "dep:ngrok",
    "dep:picky-krb",
    "dep:rand",
    "dep:rustls-cng",
    "dep:sha2",
    "dep:terminal-streamer",
    "dep:tokio-tungstenite",
    "dep:tokio-retry",
    "dep:tungstenite",
    "dep:zip",
    "axum/ws",
    "axum-extra/typed-header",
    "ironrdp-acceptor/rustcrypto",
    "ironrdp-connector/rustcrypto",
    "ironrdp-pdu/legacy-crypto",
    "ironrdp-tokio/rustcrypto",
    "picky/jwe-crypto",
    "picky/pkcs12",
    "picky/rustcrypto",
    "reqwest/rustls-tls-native-roots",
    "rustls-cng/ring",
    "tokio-rustls/ring",
    "tokio-tungstenite/rustls-tls-native-roots",
]
fips = [
    "agent-tunnel/fips",
    "aws-lc-rs/fips",
    "dep:aws-lc-rs",
    "picky/fips-aws-lc",
    "reqwest/rustls-tls-native-roots-no-provider",
    "tokio-rustls/fips",
]
openapi = ["dep:utoipa", "standard"]

[dependencies]

# In-house
secure-memory.path = "../crates/secure-memory"
transport.path = "../crates/transport"
jmux-proxy.path = "../crates/jmux-proxy"
devolutions-agent-shared.path = "../crates/devolutions-agent-shared"
devolutions-gateway-task.path = "../crates/devolutions-gateway-task"
devolutions-log.path = "../crates/devolutions-log"
job-queue.path = "../crates/job-queue"
job-queue-libsql.path = "../crates/job-queue-libsql"
traffic-audit.path = "../crates/traffic-audit"
traffic-audit-libsql.path = "../crates/traffic-audit-libsql"
network-scanner.path = "../crates/network-scanner"
video-streamer.path = "../crates/video-streamer"
terminal-streamer = { path = "../crates/terminal-streamer", optional = true }
network-monitor.path = "../crates/network-monitor"
sysevent.path = "../crates/sysevent"
sysevent-codes.path = "../crates/sysevent-codes"
agent-tunnel = { path = "../crates/agent-tunnel", default-features = false }
agent-tunnel-libsql = { path = "../crates/agent-tunnel-libsql", default-features = false, optional = true }
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP.git", rev = "83ca5e5c2f97dc86c4dde72f0738be47d87a9598", version = "=0.9.0", default-features = false, features = ["std"] }
ironrdp-core = { git = "https://github.com/Devolutions/IronRDP.git", rev = "83ca5e5c2f97dc86c4dde72f0738be47d87a9598", version = "=0.2.1", features = ["std"] }
ironrdp-rdcleanpath = "0.2"
ironrdp-tokio = { git = "https://github.com/Devolutions/IronRDP.git", rev = "83ca5e5c2f97dc86c4dde72f0738be47d87a9598", version = "=0.10.0", default-features = false, optional = true }
ironrdp-connector = { git = "https://github.com/Devolutions/IronRDP.git", rev = "83ca5e5c2f97dc86c4dde72f0738be47d87a9598", version = "=0.10.0", default-features = false, optional = true }
ironrdp-acceptor = { git = "https://github.com/Devolutions/IronRDP.git", rev = "83ca5e5c2f97dc86c4dde72f0738be47d87a9598", version = "=0.10.0", default-features = false, optional = true }
ceviche = "0.7"
picky-krb = { version = "0.12", optional = true }
kdc = { version = "0.1", optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
serde-querystring = "0.3.0"

# Utils, misc
hostname = "0.4"
camino = { version = "1.1", features = ["serde1"] }
smol_str = { version = "0.3", features = ["serde"] }
nonempty = "0.12"
tap = "1.0"
bytes = "1.10"
cfg-if = "1.0"
url = { version = "2.5", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
time = { version = "0.3", default-features = false, features = ["std", "serde", "formatting"] }
parking_lot = "0.12"
anyhow = "1.0"
thiserror = "2"
typed-builder = "0.21"
backoff = "0.4"
bitflags = "2.9"
rand = { version = "0.10", optional = true }

# Security, crypto…
aws-lc-rs = { version = "=1.18.1", default-features = false, optional = true }
picky = { version = "7.0.0-rc.25", default-features = false, features = ["jose", "x509", "time_conversion"] }
zeroize = { version = "1.8", features = ["derive"] }
chacha20poly1305 = { version = "0.10", optional = true }
secrecy = { version = "0.10", features = ["serde"] }
multibase = "0.9"
argon2 = { version = "0.5", features = ["std"], optional = true }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
sha2 = { version = "0.10", optional = true }
hex = "0.4"
rustls-native-certs = "0.8"

# Logging
tracing = "0.1"

# Async, futures…
tokio = { version = "1.52", features = ["signal", "net", "io-util", "time", "rt", "rt-multi-thread", "sync", "macros", "parking_lot", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "socks"] }
http-client-proxy = { path = "../crates/http-client-proxy" }
futures = "0.3"
async-trait = "0.1"
tower = { version = "0.5", features = ["timeout"] }
ngrok = { version = "0.13", optional = true }

# HTTP
hyper = "1.6"
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing", "tower-log"] }
axum-extra = { version = "0.10", features = ["query", "async-read-body"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tungstenite = { version = "0.29", optional = true } # Should be the same version as `axum` (we perform error downcasting for better error reporting)
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"], optional = true } # Should use the same version of tungstenite as `axum`
http-body-util = "0.1"
tokio-retry = { version = "0.3", optional = true }
zip = { version = "2.4", default-features = false, optional = true }
tempfile = "3"

# OpenAPI generator
utoipa = { version = "4.2", default-features = false, features = ["uuid", "time"], optional = true }

# Safe pin projection
pin-project-lite = "0.2"

# Native plugins
# QUESTION: now that we have Cadeau integrated, should we remove this feature?
# FIXME: these libraries are considered unmaintained. We could use dlopen2 (to audit).
dlopen = "0.1"
dlopen_derive = "0.1"

# Video processing for session recording
cadeau = { version = "0.5.2", features = ["dlopen"] }

# Dependencies required for PCAP support
# QUESTION: should we keep that built-in?
pcap-file = "2.0"
etherparse = "0.15"


[target.'cfg(unix)'.dependencies]
sysevent-syslog.path = "../crates/sysevent-syslog"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
rustls-cng = { version = "0.5", default-features = false, features = ["logging", "tls12"], optional = true }
sysevent-winevent.path = "../crates/sysevent-winevent"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
base64 = "0.23"
tokio-test = "0.4"
proptest = "1.7"
tempfile = "3"
rstest = "0.25"
devolutions-gateway-generators = { path = "../crates/devolutions-gateway-generators", default-features = false }
http-body-util = "0.1"
tracing-cov-mark = { path = "../crates/tracing-cov-mark" }
tracing-subscriber = "0.3"
expect-test = "1.5"
